name: Build releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TURBOJPEG_STATIC: '1'

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake nasm pkg-config libxkbcommon-dev libwayland-dev

      - name: Install Windows assembler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable '${{ matrix.target }}'

      - name: Build release binary
        run: cargo +stable build --locked --release --target ${{ matrix.target }}

      - name: Prepare Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rust_image_converter dist/image-converter-${{ matrix.platform }}

      - name: Prepare Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target/${{ matrix.target }}/release/rust_image_converter.exe dist/image-converter-${{ matrix.platform }}.exe

      - name: Upload executable for publishing
        uses: actions/upload-artifact@v4
        with:
          name: image-converter-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-converter-*
          path: dist
          merge-multiple: true

      - name: Publish executables
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
          fi
